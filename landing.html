<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Try Review Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F2;
    --ink:#1F2A22;
    --green:#2E7D4F;
    --green-dim:#256640;
    --line:#E0DED0;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{width:100%;max-width:420px;}
  .wordmark{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    text-align:center;
    color:var(--green-dim);
    margin-bottom:28px;
    letter-spacing:-0.01em;
  }
  .wordmark span{color:var(--ink);}
  .check-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
  }
  .check-circle{
    width:56px;height:56px;border-radius:50%;
    background:var(--green);
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transform:scale(0.6);
    animation:pop 0.5s cubic-bezier(.2,1.4,.4,1) 0.15s forwards;
  }
  @keyframes pop{ to{ opacity:1; transform:scale(1); } }
  .check-circle svg{
    stroke-dasharray:24;
    stroke-dashoffset:24;
    animation:draw 0.4s ease-out 0.5s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:26px;
    line-height:1.25;
    text-align:center;
    margin:0 0 10px 0;
    letter-spacing:-0.01em;
  }
  .sub{
    text-align:center;
    font-size:14.5px;
    color:#5c584d;
    margin:0 0 26px 0;
    line-height:1.5;
  }
  .photo{
    width:100%;
    border-radius:8px;
    border:1px solid var(--line);
    margin-bottom:26px;
    display:block;
  }
  .btn-google{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:15px 20px;
    font-size:15.5px;
    font-weight:500;
    font-family:inherit;
    cursor:pointer;
    text-decoration:none;
    box-shadow:0 1px 2px rgba(31,42,34,0.12);
  }
  .btn-google:hover{background:var(--green-dim);}
  .btn-google .g-icon{flex-shrink:0;}
  .hint{
    text-align:center;
    font-size:12.5px;
    color:#8a8578;
    margin-top:14px;
  }
  .fallback{
    text-align:center;
    font-size:14px;
    color:#5c584d;
    padding:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">🌿 Try Review<span>Bloom</span></div>

  <div class="check-wrap">
    <div class="check-circle">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <h1 id="headline">Thanks for choosing us!</h1>
  <p class="sub" id="subline">We hope everything went well.</p>

  <img id="job-photo" class="photo" style="display:none;" alt="Photo from your job">

  <a id="review-btn" class="btn-google" href="#" style="display:none;">
    <svg class="g-icon" width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.68-3.88 2.68-6.62z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/>
      <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
    </svg>
    <span>Leave a review on Google</span>
  </a>
  <p class="hint" id="review-hint" style="display:none;">Takes less than a minute</p>

  <div class="fallback" id="fallback" style="display:none;">
    Thanks again for your business — we really appreciate it!
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get('name');
const business = params.get('business');
const review = params.get('review');
const photo = params.get('photo');

if (name) {
  document.getElementById('headline').textContent = `Thanks, ${name}!`;
}
if (business) {
  document.getElementById('subline').textContent = `We hope we've made things easier for you at ${business}.`;
}
if (photo) {
  const img = document.getElementById('job-photo');
  img.src = photo;
  img.style.display = 'block';
}
if (review) {
  const btn = document.getElementById('review-btn');
  btn.href = review;
  btn.style.display = 'flex';
  document.getElementById('review-hint').style.display = 'block';
} else {
  document.getElementById('fallback').style.display = 'block';
}
</script>
</body>
</html>
